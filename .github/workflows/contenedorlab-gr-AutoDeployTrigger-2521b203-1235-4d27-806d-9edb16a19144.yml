name: Trigger auto deployment for contenedorlab-gr

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ dev ]
    paths:
    - '**'
    - '.github/workflows/contenedorlab-gr-AutoDeployTrigger-2521b203-1235-4d27-806d-9edb16a19144.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONTENEDORLABGR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTENEDORLABGR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTENEDORLABGR_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.CONTENEDORLABGR_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTENEDORLABGR_REGISTRY_PASSWORD }}
          containerAppName: contenedorlab-gr
          resourceGroup: grupo_RicardoGreivin
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


